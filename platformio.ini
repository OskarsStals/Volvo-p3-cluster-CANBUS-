; Each firmware stage is its own environment with its own folder under src/.
; Build and flash one with:  pio run -e <name> -t upload
; Planned next: simulator (wakes the cluster and drives the gauges).

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = coryjfowler/mcp_can@^1.5.1
build_flags = -DDEBUG_MODE=0

[env:sniffer]
build_src_filter = +<sniffer/>

; Same sniffer for tapping a real car (OBD pins 6/14): fixed 500 kbit/s,
; listen-only, all transmitting commands compiled out.
[env:car]
build_src_filter = +<sniffer/>
build_flags = ${env.build_flags} -DCAR_LISTEN_ONLY

; BENCH ONLY: replays a real P3 bus snapshot to the cluster. Transmits.
[env:simulator]
build_src_filter = +<simulator/>

; BENCH ONLY: searches for what wakes the cluster's second CAN bus. Transmits.
[env:waker]
build_src_filter = +<waker/>
build_flags = ${env.build_flags} -I src/simulator
